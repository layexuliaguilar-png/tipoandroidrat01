name: build-pc

on:
  push:
    branches: [main]
    paths:
      - 'client-pc/**'
      - '.github/workflows/build-pc.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Compilar
        working-directory: client-pc
        run: |
          go mod tidy
          go build -ldflags "-s -w -H=windowsgui" -o app.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: app-exe
          path: client-pc/app.exe

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pc-latest
          name: "Cliente PC"
          body: "app.exe compilado automaticamente por GitHub Actions"
          files: client-pc/app.exe
