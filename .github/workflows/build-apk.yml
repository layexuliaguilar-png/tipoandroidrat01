name: build-apk

on:
  push:
    branches: [main]
    paths:
      - 'client-android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Aceptar licencias del SDK
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            echo "licencias aceptadas con $SDKM"
          else
            echo "sdkmanager no encontrado, sigo igual"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls $ANDROID_HOME/platforms 2>/dev/null || echo "sin platforms preinstalados"

      - name: Cargar keystore
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > client-android/cloudsync.keystore
            echo "keystore cargado: firma propia"
          else
            echo "sin keystore: se firma con debug"
          fi

      - name: Compilar
        working-directory: client-android
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: cloudsync
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renombrar
        run: |
          mkdir -p salida
          cp client-android/app/build/outputs/apk/release/app-release.apk salida/CloudSync.apk
          ls -la salida

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: salida/CloudSync.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "Cliente Android"
          body: "APK firmado, compilado por GitHub Actions"
          files: salida/CloudSync.apk
