name: gen-keystore

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generar keystore
        run: |
          keytool -genkeypair -v \
            -keystore cloudsync.keystore \
            -alias cloudsync \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass cloudsync -keypass cloudsync \
            -dname "CN=CloudSync, OU=Mobile, O=CloudSync, L=Bogota, C=CO"

      - name: Mostrar base64
        run: |
          base64 -w0 cloudsync.keystore > keystore.b64
          echo "========== COPIA DESDE AQUI =========="
          cat keystore.b64
          echo
          echo "========== HASTA AQUI =========="

      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: cloudsync.keystore
